          ctx.beginPath(); ctx.arc(r.x, r.y, 2.5, 0, 6.283); ctx.fill();
          if(r.vy >= -0.8){
            r.dead = true;
            for(let i=0;i<60;i++){
              const a = rnd(0, 6.283), sp = rnd(1, 5.5);
              st.sparks.push({ x: r.x, y: r.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1, hue: r.hue + rnd(-25,25), decay: rnd(0.009, 0.016) });
            }
            for(let i=0;i<6;i++){
              const a = i / 6 * 6.283 + rnd(-0.3, 0.3), sp = rnd(2, 3.5);
              st.cards.push({ card: randCard(), x: r.x, y: r.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: rnd(0, 6.28), vr: rnd(-0.1, 0.1), life: 1 });
            }
          }
        }
        st.rockets = st.rockets.filter(r => !r.dead);
        for(const p of st.sparks){
          p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.045 * dt;
          p.x += p.vx * dt; p.y += p.vy * dt; p.life -= p.decay * dt;
          ctx.fillStyle = `hsla(${p.hue},100%,62%,${Math.max(0,p.life)})`;
          ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 6.283); ctx.fill();
        }
        st.sparks = st.sparks.filter(p => p.life > 0);
        ctx.globalCompositeOperation = 'source-over';
        for(const c of st.cards){
          c.vx *= 0.99; c.vy = c.vy * 0.99 + 0.04 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt; c.life -= 0.009 * dt;
          drawCard(ctx, c.card, c.x, c.y, st.cw, st.ch, c.rot, 1, c.life);
        }
        st.cards = st.cards.filter(c => c.life > 0);
        return t < 5500 || st.rockets.length > 0 || st.sparks.length > 0 || st.cards.length > 0;
      }
    },

    // Cards from the completed suits bounce out across the table, leaving a trail behind them.
    cascade: {
      init(w, h){
        const cw = Math.max(40, Math.min(96, w * 0.075));
        return { cw, ch: cw * 1.4, cards: [], launched: 0, total: 26, next: 0, suits: wonSuits() };
      },
      step(st, ctx, w, h, t, dt){
        if(st.launched < st.total && t >= st.next){
          const i = st.launched++;
          st.cards.push({ x: rnd(w*0.08, w*0.92 - st.cw), y: h * 0.06, vx: (Math.random() < 0.5 ? -1 : 1) * rnd(3, 7),
            vy: -rnd(0, 6), rank: RANKS[12 - (i % 13)], suit: st.suits[i % st.suits.length] });
          st.next = t + 240;
        }
        for(const c of st.cards){
          c.vy += 0.55 * dt; c.x += c.vx * dt; c.y += c.vy * dt;
          if(c.y + st.ch > h){ c.y = h - st.ch; c.vy *= -0.8; }
          drawMiniCard(ctx, c.x, c.y, st.cw, st.ch, c.rank, c.suit);
        }
        st.cards = st.cards.filter(c => c.x > -st.cw && c.x < w);
        return st.launched < st.total || st.cards.length > 0;
      }
    },

    // On theme: spiders drop in on silk threads, each carrying a card, then haul them back up.
    spiders: {
      init(w, h){
        const n = Math.max(6, Math.floor(w / 140));
        const list = [];
        for(let i=0;i<n;i++) list.push({ x: (i + 0.5) * w / n + rnd(-w/n*0.2, w/n*0.2), target: rnd(h*0.15, h*0.65),
          delay: rnd(0, 1300), size: rnd(28, 46), phase: rnd(0, 6.28), card: randCard() });
        return { list };
      },
      step(st, ctx, w, h, t, dt){
        ctx.clearRect(0,0,w,h);
        let alive = t < 2000;
        for(const sp of st.list){
          const lt = t - sp.delay;
          if(lt < 0){ alive = true; continue; }
          let y = sp.target * (1 - Math.exp(-lt/380) * Math.cos(lt/190));
          if(t > 5200) y -= (t - 5200) * 0.75;
          const cw = sp.size * 1.15, ch = cw * 1.4;
          if(y > -(sp.size + ch)) alive = true; else continue;
          const x = sp.x + Math.sin(t/520 + sp.phase) * 7;
          ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(sp.x, 0); ctx.lineTo(x, y - sp.size*0.35); ctx.stroke();
          drawCard(ctx, sp.card, x, y + sp.size * 0.2 + ch / 2, cw, ch, Math.sin(t / 600 + sp.phase) * 0.12);
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
          ctx.font = `${Math.round(sp.size)}px system-ui, sans-serif`;
          ctx.fillText('🕷️', x, y);
        }
        return alive;
      }
    },

    // Bunches of balloons float your cards up and away.
    balloons: {
      init(w, h){ const { cw, ch } = animCardSize(w, h); return { items: [], next: 0, cw, ch }; },
      step(st, ctx, w, h, t, dt){
        ctx.clearRect(0,0,w,h);
        if(t < 4500 && t >= st.next){
          const n = Math.random() < 0.3 ? 2 : Math.random() < 0.15 ? 3 : 1;
          const hues = []; for(let i=0;i<n;i++) hues.push(pick([0, 30, 50, 140, 200, 280, 330]));
          st.items.push({ x: rnd(w * 0.05, w * 0.95), y: h + st.ch, vy: rnd(2.4, 3.6) * Math.max(1, h / 700), phase: rnd(0, 6.28), amp: rnd(10, 25), hues, card: randCard(), str: rnd(0.9, 1.4) });
          st.next = t + 300;
        }
        const br = st.cw * 0.42;
        for(const b of st.items){
          b.y -= b.vy * dt;
          const x = b.x + Math.sin(t / 650 + b.phase) * b.amp;
          const top = b.y - st.ch / 2, by = top - st.ch * b.str;
          b.hues.forEach((hue, i)=>{
            const bx = x + (i - (b.hues.length - 1) / 2) * br * 1.5, byy = by - (i % 2) * br * 0.5;
            ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(bx, byy + br * 1.15); ctx.stroke();
            const g = ctx.createRadialGradient(bx - br * 0.35, byy - br * 0.4, br * 0.1, bx, byy, br * 1.2);
            g.addColorStop(0, `hsl(${hue},90%,78%)`); g.addColorStop(1, `hsl(${hue},80%,45%)`);
            ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(bx, byy, br, br * 1.18, 0, 0, 6.283); ctx.fill();
            ctx.beginPath(); ctx.moveTo(bx - 3, byy + br * 1.18 + 3); ctx.lineTo(bx + 3, byy + br * 1.18 + 3); ctx.lineTo(bx, byy + br * 1.1); ctx.fill();
          });
          drawCard(ctx, b.card, x, b.y, st.cw, st.ch, Math.sin(t / 500 + b.phase) * 0.1);
        }
        st.items = st.items.filter(b => b.y > -st.ch * 3);
        return (t < 4500 || st.items.length > 0) && t < 9000;
      }
    },

    // A swaying funnel that whirls the cards and debris around, then flings them away.
    tornado: {
      init(w, h){
        const cw = Math.max(24, Math.min(46, w * 0.038));
        const suits = wonSuits();
        const parts = [];
        for(let i=0;i<200;i++) parts.push({ y: Math.pow(Math.random(), 0.8), a: rnd(0, 6.283), sp: rnd(2.5, 4.5),
          card: i < 22, rank: pick(RANKS), suit: pick(suits), s: rnd(1.5, 3.5) });
        return { parts, cw, ch: cw * 1.4 };
      },
      step(st, ctx, w, h, t, dt){
        ctx.clearRect(0,0,w,h);
        const grow = Math.min(1, t / 1200), fling = t > 5200 ? (t - 5200) / 1600 : 0;
        const baseX = w * 0.5 + Math.sin(t / 1300) * w * 0.16;
        const items = st.parts.map(p=>{
          p.a += p.sp * dt * 0.03 * (1 + fling * 2);
          const r = (h * 0.035 + p.y * h * 0.3) * grow * (1 + fling * 3);
          const sway = Math.sin(t / 700 + p.y * 3) * w * 0.05 * p.y;
          return { p, x: baseX + sway + Math.cos(p.a) * r, y: h * (1 - p.y * 0.92) - fling * h * 0.25 * p.y, z: Math.sin(p.a) };
        });
        items.sort((a, b) => a.z - b.z); // back of the funnel first
        const fade = Math.max(0, 1 - fling);
        for(const it of items){
          const near = (it.z + 1) / 2, sc = 0.7 + 0.3 * near;
          ctx.globalAlpha = (0.35 + 0.65 * near) * fade;
          if(it.p.card){
            ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.p.a * 1.7);
            drawMiniCard(ctx, -st.cw * sc / 2, -st.ch * sc / 2, st.cw * sc, st.ch * sc, it.p.rank, it.p.suit);
            ctx.restore();
          } else {
            ctx.fillStyle = 'rgba(190,195,205,0.75)';
            ctx.beginPath(); ctx.arc(it.x, it.y, it.p.s * sc, 0, 6.283); ctx.fill();
          }
        }
        ctx.globalAlpha = 1;
        return t < 6800;
      }
    },

    // The volcano rises and erupts your cards, glowing, in high arcs, with smoke and lava flows.
    volcano: {
      init(w, h){ const { cw, ch } = animCardSize(w, h, 0.9); return { lava: [], smoke: [], cards: [], next: 800, cx: w * 0.5, halfW: Math.min(w * 0.34, 400), cw, ch }; },
      step(st, ctx, w, h, t, dt){
        ctx.clearRect(0,0,w,h);
        const rise = Math.min(1, t / 900), sink = t > 6200 ? Math.min(1, (t - 6200) / 1200) : 0;
        const peakY = h - h * 0.36 * (rise - sink * 0.5);
        const s = h / 800;
        if(t > 800 && t < 5200){
          st.lava.push({ x: st.cx + rnd(-12, 12), y: peakY, vx: rnd(-3.5, 3.5), vy: -rnd(7, 14) * s, life: 1, r: rnd(1.5, 3.5) });
          if(Math.random() < 0.35) st.smoke.push({ x: st.cx + rnd(-20, 20), y: peakY, vy: -rnd(0.6, 1.4), r: rnd(14, 28), life: 1 });
          if(t >= st.next){
            st.cards.push({ card: randCard(), x: st.cx + rnd(-10, 10), y: peakY, vx: rnd(-4.5, 4.5), vy: -rnd(9, 15) * s, rot: rnd(0, 6.28), vr: rnd(-0.2, 0.2) });
            st.next = t + rnd(110, 200);
          }
        }
        for(const m of st.smoke){
          m.y += m.vy * dt; m.x += Math.sin(t / 800 + m.r) * 0.3 * dt; m.r += 0.25 * dt; m.life -= 0.005 * dt;
          ctx.fillStyle = `rgba(70,64,64,${Math.max(0, m.life) * 0.45})`;
          ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill();
        }
        st.smoke = st.smoke.filter(m => m.life > 0);
        ctx.fillStyle = '#2a1a14';
        ctx.beginPath(); ctx.moveTo(st.cx - st.halfW, h + 2); ctx.lineTo(st.cx - 26, peakY); ctx.lineTo(st.cx + 26, peakY); ctx.lineTo(st.cx + st.halfW, h + 2); ctx.closePath(); ctx.fill();
        if(t > 1300){
          const L = Math.min(1, (t - 1300) / 2600);
          ctx.strokeStyle = `rgba(255,110,20,${0.85 * (1 - sink)})`; ctx.lineWidth = 4; ctx.lineCap = 'round';
          [[-1, 0.6], [1, 0.8]].forEach(([dir, len])=>{
            ctx.beginPath();
            for(let f=0; f<=len * L; f+=0.02){
              const x = st.cx + dir * (26 + (st.halfW - 26) * f) - dir * 10 + Math.sin(f * 30) * 3;
              const y = peakY + (h - peakY) * f + 4;
              if(f === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
          });
        }
        const glow = ctx.createRadialGradient(st.cx, peakY, 2, st.cx, peakY, 70);
        glow.addColorStop(0, `rgba(255,170,60,${0.9 * (1 - sink)})`); glow.addColorStop(1, 'rgba(255,80,0,0)');
        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(st.cx, peakY, 70, 0, 6.283); ctx.fill();
        ctx.save(); ctx.shadowColor = 'rgba(255,120,30,0.95)'; ctx.shadowBlur = 16;
        for(const c of st.cards){ tumble(c, dt, 0.25 * s); drawCard(ctx, c.card, c.x, c.y, st.cw, st.ch, c.rot); }
        ctx.restore();
        st.cards = st.cards.filter(c => c.y < h + st.ch);
        ctx.globalCompositeOperation = 'lighter';
        for(const q of st.lava){
          q.vy += 0.25 * dt * s; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= 0.006 * dt;
          ctx.fillStyle = `hsla(${20 + 40 * q.life},100%,${45 + 20 * q.life}%,${Math.max(0, q.life)})`;
          ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
        st.lava = st.lava.filter(q => q.life > 0 && q.y < h + 10);
        return t < 7400;
      }
    },

    // A blizzard freezes your cards into blocks of ice, which then shatter and drop away.
    icestorm: {
      init(w, h){
        const flakes = [];
        for(let i=0;i<200;i++) flakes.push({ x: rnd(-w * 0.3, w), y: rnd(-h, h), r: rnd(1, 3.5), sp: rnd(1.5, 4), sway: rnd(0, 6.28), big: i % 14 === 0 });
        const { cw, ch } = animCardSize(w, h, 1.2);
        const cards = [], n = 7;
        for(let i=0;i<n;i++) cards.push({ card: randCard(), x: (i + 0.5) * w / n + rnd(-w / n * 0.15, w / n * 0.15), y: rnd(h * 0.25, h * 0.65),
          rot: rnd(-0.3, 0.3), vx: 0, vy: 0, vr: 0, shatterAt: 4200 + i * 140 + rnd(0, 200), shattered: false });
        return { flakes, shards: [], cards, ice: [], cw, ch };
      },
      step(st, ctx, w, h, t, dt){
        ctx.clearRect(0,0,w,h);
        const active = t < 6000;
        const gust = 2 + 3 * Math.max(0, Math.sin(t / 900));
        const freeze = clamp01((t - 700) / 2600);
        for(const c of st.cards){
          if(!c.shattered && t >= c.shatterAt){
            c.shattered = true; c.vx = rnd(-1, 1); c.vy = rnd(-2, 0); c.vr = rnd(-0.08, 0.08);
            for(let i=0;i<9;i++){
              const a = rnd(0, 6.283), sp = rnd(2, 6), r = st.cw * rnd(0.25, 0.5);
              st.ice.push({ x: c.x, y: c.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2, rot: rnd(0, 6.28), vr: rnd(-0.2, 0.2), life: 1,
                pts: [[0, -r], [r * rnd(0.4, 0.9), r * rnd(0.2, 0.8)], [-r * rnd(0.4, 0.9), r * rnd(0.2, 0.8)]] });
            }
          }
          if(c.shattered) tumble(c, dt, 0.3);
          else { c.y += Math.sin(t / 900 + c.x) * 0.05 * dt; }
          drawCard(ctx, c.card, c.x, c.y, st.cw, st.ch, c.rot);
          if(!c.shattered && freeze > 0){
            const pad = st.cw * 0.14 * freeze;
            ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
            roundRectPath(ctx, -st.cw / 2 - pad, -st.ch / 2 - pad, st.cw + pad * 2, st.ch + pad * 2, st.cw * 0.12);
            ctx.fillStyle = `rgba(200,235,255,${0.42 * freeze})`; ctx.fill();
            ctx.strokeStyle = `rgba(255,255,255,${0.8 * freeze})`; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.strokeStyle = `rgba(255,255,255,${0.7 * freeze})`; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(-st.cw * 0.35, -st.ch * 0.4); ctx.lineTo(-st.cw * 0.1, -st.ch * 0.15); ctx.stroke();
            ctx.restore();
          }
        }
        st.cards = st.cards.filter(c => c.y < h + st.ch * 1.5);
        for(const q of st.ice){
          tumble(q, dt, 0.3); q.life -= 0.012 * dt;
          ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.globalAlpha = Math.max(0, q.life);
          ctx.beginPath(); ctx.moveTo(q.pts[0][0], q.pts[0][1]); ctx.lineTo(q.pts[1][0], q.pts[1][1]); ctx.lineTo(q.pts[2][0], q.pts[2][1]); ctx.closePath();
          ctx.fillStyle = 'rgba(205,238,255,0.75)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1; ctx.stroke();
          ctx.restore();
        }
        st.ice = st.ice.filter(q => q.life > 0);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        for(const f of st.flakes){
          f.x += (gust + Math.sin(t / 500 + f.sway)) * dt * f.r * 0.5;
          f.y += f.sp * dt;
          if((f.y > h + 20 || f.x > w + 20) && active){ f.y = rnd(-40, -10); f.x = rnd(-w * 0.4, w); }
          ctx.globalAlpha = 0.5 + f.r / 7;
          ctx.fillStyle = '#fff';
          if(f.big){ ctx.font = `${Math.round(f.r * 7)}px system-ui, sans-serif`; ctx.fillText('❄', f.x, f.y); }
          else { ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill(); }
        }
        ctx.globalAlpha = 1;
        const frost = Math.min(1, t / 4000) * (t > 6000 ? Math.max(0, 1 - (t - 6000) / 1500) : 1);
        const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.25, w / 2, h / 2, Math.hypot(w, h) / 2);
        g.addColorStop(0, 'rgba(200,235,255,0)'); g.addColorStop(1, `rgba(215,240,255,${0.5 * frost})`);
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
        return t < 7500;
      }
    },

    // Water rises with rolling waves; cards float and bob on the surface, then it all drains away.
    flood: {
      init(w, h){
        const cw = Math.max(28, Math.min(58, w * 0.05));
        const suits = wonSuits();
        const cards = [];
        for(let i=0;i<9;i++) cards.push({ x: rnd(0, w), rank: pick(RANKS), suit: pick(suits), ph: rnd(0, 6.28), vx: rnd(-0.7, 0.7) });
        return { cards, cw, ch: cw * 1.4, bubbles: [] };
      },
      step(st, ctx, w, h, t, dt){
        ctx.clearRect(0,0,w,h);
        const k = t < 3000 ? t / 3000 : t < 6000 ? 1 : Math.max(0, 1 - (t - 6000) / 2000);
        const level = h - k * k * (3 - 2 * k) * h * 0.55;
        const surf = (x, amp, len, sp, off) => level + Math.sin(x / len + t / sp + off) * amp;
        const wave = (amp, len, sp, off, fill)=>{
          ctx.beginPath(); ctx.moveTo(0, h);
          for(let x=0; x<=w + 12; x+=12) ctx.lineTo(x, surf(x, amp, len, sp, off));
          ctx.lineTo(w, h); ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
        };
        wave(10, 90, 700, 1.3, 'rgba(30,90,160,0.55)');
        for(const c of st.cards){
          c.x += c.vx * dt; if(c.x < -st.cw) c.x = w; if(c.x > w + st.cw) c.x = -st.cw;
          const y = surf(c.x, 14, 110, 600, 0);
          if(y > h - st.ch * 0.2) continue;
          const slope = Math.cos(c.x / 110 + t / 600) * 14 / 110;
          ctx.save(); ctx.translate(c.x, y - st.ch * 0.25); ctx.rotate(Math.atan(slope) + Math.sin(t / 500 + c.ph) * 0.15);
          drawMiniCard(ctx, -st.cw / 2, -st.ch / 2, st.cw, st.ch, c.rank, c.suit);
          ctx.restore();
        }
        wave(14, 110, 600, 0, 'rgba(40,130,200,0.5)');
        if(k > 0.2 && Math.random() < 0.3) st.bubbles.push({ x: rnd(0, w), y: h + 10, r: rnd(2, 6), vy: rnd(1, 2.5) });
        ctx.strokeStyle = 'rgba(220,240,255,0.7)'; ctx.lineWidth = 1;
        for(const b of st.bubbles){
          b.y -= b.vy * dt; b.x += Math.sin(t / 300 + b.r) * 0.3;
          ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.stroke();
        }
        st.bubbles = st.bubbles.filter(b => b.y > level + 4);
        return t < 8000;
      }
    },

    // Northern lights, with a ribbon of cards gliding along the brightest curtain.
    aurora: {
      init(w, h){
        const stars = [];
        for(let i=0;i<90;i++) stars.push({ x: rnd(0, w), y: rnd(0, h * 0.75), r: rnd(0.5, 1.6), ph: rnd(0, 6.28) });
        const { cw, ch } = animCardSize(w, h);
        const cards = []; for(let i=0;i<9;i++) cards.push(randCard());
        return { stars, cards, cw, ch };
      },
      step(st, ctx, w, h, t, dt){
        ctx.clearRect(0,0,w,h);
        const a = t < 1500 ? t / 1500 : t > 6500 ? Math.max(0, 1 - (t - 6500) / 1500) : 1;
        for(const s of st.stars){
          ctx.fillStyle = `rgba(255,255,255,${a * (0.35 + 0.65 * Math.abs(Math.sin(t / 600 + s.ph)))})`;
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
        }
        ctx.globalCompositeOperation = 'lighter';
        const bands = [ { hue: 140, y: 0.30, amp: 0.06, sp: 2200 }, { hue: 172, y: 0.38, amp: 0.05, sp: 2900 }, { hue: 285, y: 0.22, amp: 0.04, sp: 3500 } ];
        const bandY = (b, x) => h * (b.y + b.amp * Math.sin(x / (w * 0.18) + t / b.sp) + 0.02 * Math.sin(x / (w * 0.05) - t / 900));
        for(const b of bands){
          for(let x=0; x<w; x+=9){
            const base = bandY(b, x);
            const hgt = h * (0.16 + 0.07 * Math.sin(x / (w * 0.11) + t / 1700));
            const flick = 0.6 + 0.4 * Math.sin(x / 23 + t / 400);
            for(let j=0;j<4;j++){
              ctx.fillStyle = `hsla(${b.hue + j * 6},95%,58%,${a * flick * (0.28 - j * 0.06)})`;
              ctx.fillRect(x, base - hgt * (j + 1) / 4, 9, hgt / 4 + 1);
            }
          }
        }
        ctx.globalCompositeOperation = 'source-over';
        const span = w + st.cw * 2, gap = span / st.cards.length;
        st.cards.forEach((c, i)=>{
          const x = ((t * w / 7000 + i * gap) % span) - st.cw;
          const y = bandY(bands[0], x) + st.ch * 0.2;
          const slope = (bandY(bands[0], x + 5) - bandY(bands[0], x - 5)) / 10;
          drawCard(ctx, c, x, y, st.cw, st.ch, Math.atan(slope), Math.cos(t / 900 + i), a);
        });
        return t < 8000;
      }
    },

    // Cards streak in as meteors with fiery tails; the big ones burst into sparks.
    meteors: {
      init(w, h){ const { cw, ch } = animCardSize(w, h, 0.85); return { m: [], sparks: [], next: 0, cw, ch }; },
      step(st, ctx, w, h, t, dt){
        ctx.clearRect(0,0,w,h);
        if(t < 5500 && t >= st.next){
          const big = Math.random() < 0.2, sp = rnd(0.9, 1.3) * Math.max(6, w / 130);
          st.m.push({ card: randCard(), x: rnd(w * 0.25, w * 1.15), y: rnd(-st.ch, h * 0.3), vx: -sp, vy: sp * 0.6, big, burstY: rnd(h * 0.45, h * 0.8), tail: rnd(0.15, 0.25) * Math.max(w, 400), spin: rnd(-0.05, 0.05), rot: 0 });
          st.next = t + rnd(200, 400);
        }
        for(const m of st.m){
          m.x += m.vx * dt; m.y += m.vy * dt; m.rot += m.spin * dt;
          const len = Math.hypot(m.vx, m.vy), tx = m.x - m.vx / len * m.tail, ty = m.y - m.vy / len * m.tail;
          ctx.globalCompositeOperation = 'lighter';
          const tg = ctx.createLinearGradient(m.x, m.y, tx, ty);
          tg.addColorStop(0, 'rgba(255,190,90,0.85)'); tg.addColorStop(0.4, 'rgba(255,120,40,0.35)'); tg.addColorStop(1, 'rgba(255,80,20,0)');
          ctx.strokeStyle = tg; ctx.lineWidth = st.cw * 0.7; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
          ctx.globalCompositeOperation = 'source-over';
          drawCard(ctx, m.card, m.x, m.y, st.cw, st.ch, Math.atan2(m.vy, m.vx) + Math.PI / 2 + m.rot);
          if(m.big && m.y > m.burstY){
            m.dead = true;
            for(let i=0;i<40;i++){ const an = rnd(0, 6.283), sp = rnd(1, 4.5); st.sparks.push({ x: m.x, y: m.y, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, life: 1 }); }
          }
          if(m.x < -m.tail || m.y > h + m.tail) m.dead = true;
        }
        st.m = st.m.filter(m => !m.dead);
        ctx.globalCompositeOperation = 'lighter';
        for(const p of st.sparks){
          p.vy += 0.04 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= 0.015 * dt;
          ctx.fillStyle = `hsla(40,100%,65%,${Math.max(0, p.life)})`;
          ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, 6.283); ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
        st.sparks = st.sparks.filter(p => p.life > 0);
        return t < 5500 || st.m.length > 0 || st.sparks.length > 0;
      }
    },

    // Autumn leaves, with cards rocking down among them the way a leaf falls.
    leaves: {
      init(w, h){
        const L = [];
        for(let i=0;i<45;i++) L.push({ x: rnd(0, w), y: rnd(-h, -20), vy: rnd(1, 2.2), sway: rnd(0, 6.28), amp: rnd(1, 2.5),
          rot: rnd(0, 6.28), vr: rnd(-0.06, 0.06), s: rnd(20, 38), g: pick(['🍂','🍁','🍁','🍂']) });
        const { cw, ch } = animCardSize(w, h);
        const cards = [];
        for(let i=0;i<12;i++) cards.push({ card: randCard(), x0: rnd(0, w), y: rnd(-h, -ch), vy: rnd(1.1, 1.7), ph: rnd(0, 6.28), amp: rnd(30, 70) });
        return { L, cards, cw, ch };
      },
      step(st, ctx, w, h, t, dt){
        ctx.clearRect(0,0,w,h);
        let alive = false;
        const fade = fadeOutAt(t, 6500);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
        ctx.globalAlpha = fade;
        for(const l of st.L){
          l.y += l.vy * dt; l.x += Math.sin(t / 700 + l.sway) * l.amp * dt; l.rot += l.vr * dt;
          if(l.y > h + 40 && t < 5000){ l.y = rnd(-80, -20); l.x = rnd(0, w); }
          if(l.y < h + 40) alive = true;
          ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot);
          ctx.font = `${Math.round(l.s)}px system-ui, sans-serif`; ctx.fillText(l.g, 0, 0);
          ctx.restore();
        }
        ctx.globalAlpha = 1;
        for(const c of st.cards){
          c.ph += 0.035 * dt; c.y += c.vy * dt * (0.6 + 0.4 * Math.abs(Math.cos(c.ph)));
          if(c.y > h + st.ch && t < 5000){ c.y = -st.ch; c.x0 = rnd(0, w); }
          if(c.y < h + st.ch) alive = true;
          drawCard(ctx, c.card, c.x0 + Math.sin(c.ph) * c.amp, c.y, st.cw, st.ch, Math.cos(c.ph) * 0.5, 1, fade);
        }
        return (alive || t < 5000) && t < 8000;
      }
    },

    // Blossom petals and cards drifting together on a breeze, the cards slowly turning over.
    blossoms: {
      init(w, h){
        const P = [];
        for(let i=0;i<100;i++) P.push({ x: rnd(-w * 0.5, w), y: rnd(-h, h * 0.3), vx: rnd(1, 2.5), vy: rnd(0.6, 1.5), rot: rnd(0, 6.28), vr: rnd(-0.08, 0.08), s: rnd(5, 10), hue: rnd(330, 355), light: rnd(78, 90) });
        const { cw, ch } = animCardSize(w, h);
        const cards = [];
        for(let i=0;i<10;i++) cards.push({ card: randCard(), x: rnd(-w * 0.6, w * 0.3), y: rnd(-h * 0.2, h * 0.6), vx: rnd(1.2, 2.2), vy: rnd(0.4, 0.9), rot: rnd(-0.5, 0.5), vr: rnd(-0.015, 0.015), fp: rnd(0, 6.28), fs: rnd(0.03, 0.06) });
        return { P, cards, cw, ch };
      },
      step(st, ctx, w, h, t, dt){
        ctx.clearRect(0,0,w,h);
        let alive = false;
        const breeze = 1 + 0.6 * Math.sin(t / 1200);
        const fade = fadeOutAt(t, 6500);
        for(const p of st.P){
          p.x += p.vx * breeze * dt; p.y += (p.vy + Math.sin(t / 600 + p.rot) * 0.4) * dt; p.rot += p.vr * dt;
          if((p.x > w + 20 || p.y > h + 20) && t < 5500){ p.x = rnd(-w * 0.4, -10); p.y = rnd(-h * 0.2, h * 0.7); }
          if(p.x < w + 20 && p.y < h + 20) alive = true;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, 0.55 + 0.45 * Math.cos(p.rot * 2));
          ctx.fillStyle = `hsla(${p.hue},80%,${p.light}%,${0.9 * fade})`;
          ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.6, 0, 0, 6.283); ctx.fill();
          ctx.restore();
        }
        for(const c of st.cards){
          c.x += c.vx * breeze * dt; c.y += (c.vy + Math.sin(t / 700 + c.fp) * 0.3) * dt; c.rot += c.vr * dt; c.fp += c.fs * dt;
          if((c.x > w + st.cw || c.y > h + st.ch) && t < 5500){ c.x = rnd(-w * 0.3, -st.cw); c.y = rnd(-h * 0.1, h * 0.6); }
          if(c.x < w + st.cw && c.y < h + st.ch) alive = true;
          drawCard(ctx, c.card, c.x, c.y, st.cw, st.ch, c.rot, Math.cos(c.fp), fade);
        }
        return (alive || t < 5500) && t < 8000;
      }
    },

    // Soap bubbles carry cards upward; when a bubble pops, its card tumbles back down.
    bubbles: {
      init(){ return { b: [], rings: [], falling: [], next: 0 }; },
      step(st, ctx, w, h, t, dt){
        ctx.clearRect(0,0,w,h);
        const fade = fadeOutAt(t, 6500);
        if(t < 4800 && t >= st.next){
          const r = rnd(28, 46);
          st.b.push({ x: rnd(r, w - r), y: h + r, r, vy: rnd(1, 2), ph: rnd(0, 6.28), popAt: rnd(h * 0.08, h * 0.55), card: randCard() });
          st.next = t + 230;
        }
        ctx.globalAlpha = fade;
        for(const c of st.falling){ tumble(c, dt, 0.25); drawCard(ctx, c.card, c.x, c.y, c.cw, c.ch, c.rot, Math.cos(c.fp)); }
        st.falling = st.falling.filter(c => c.y < h + c.ch);
        for(const b of st.b){
          b.y -= b.vy * dt; b.x += Math.sin(t / 600 + b.ph) * 0.6 * dt;
          const ch = b.r * 1.25, cw = ch / 1.4;
          if(b.y < b.popAt){
            b.dead = true; st.rings.push({ x: b.x, y: b.y, r: b.r, life: 1 });
            st.falling.push({ card: b.card, x: b.x, y: b.y, vx: rnd(-1.5, 1.5), vy: -rnd(0, 2), rot: Math.sin(t / 700 + b.ph) * 0.3, vr: rnd(-0.12, 0.12), fp: 0, fs: rnd(0.05, 0.1), cw, ch });
            continue;
          }
          drawCard(ctx, b.card, b.x, b.y, cw, ch, Math.sin(t / 700 + b.ph) * 0.3);
          const g = ctx.createRadialGradient(b.x, b.y, b.r * 0.3, b.x, b.y, b.r);
          g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,0.22)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.fill();
          ctx.strokeStyle = `hsla(${(t / 8 + b.ph * 60) % 360},80%,75%,0.7)`; ctx.lineWidth = 1.5; ctx.stroke();
          ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.75, 3.6, 4.4); ctx.stroke();
        }
        st.b = st.b.filter(b => !b.dead);
        for(const r of st.rings){
          r.life -= 0.06 * dt;
          ctx.strokeStyle = `rgba(255,255,255,${Math.max(0, r.life) * 0.7})`; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (1 + (1 - r.life) * 0.6), 0, 6.283); ctx.stroke();
        }
        st.rings = st.rings.filter(r => r.life > 0);
        ctx.globalAlpha = 1;
        return (t < 4800 || st.b.length > 0 || st.falling.length > 0) && t < 8000;
      }
    },

    // A rainstorm: the first lightning bolt strikes a pile of cards and blasts it across the sky.
    lightning: {
      init(w, h){
        const rain = [];
        for(let i=0;i<200;i++) rain.push({ x: rnd(0, w * 1.2), y: rnd(-h, h), sp: rnd(14, 22), len: rnd(10, 22) });
        const { cw, ch } = animCardSize(w, h, 1.1);
        const px = w / 2, py = h * 0.8;
        const pile = [];
        for(let i=0;i<26;i++) pile.push({ card: randCard(), x: px + rnd(-cw * 0.5, cw * 0.5), y: py - i * 1.2 + rnd(-3, 3), rot: rnd(-0.35, 0.35), vx: 0, vy: 0, vr: 0 });
        return { rain, bolts: [], flash: 0, times: [700, 2500, 4000], idx: 0, pile, blasted: false, px, py, cw, ch, sparks: [] };
      },
      step(st, ctx, w, h, t, dt){
        ctx.clearRect(0,0,w,h);
        const dim = t < 600 ? t / 600 : t > 5500 ? Math.max(0, 1 - (t - 5500) / 1000) : 1;
        ctx.fillStyle = `rgba(5,8,20,${0.35 * dim})`; ctx.fillRect(0, 0, w, h);
        if(st.idx < st.times.length && t >= st.times[st.idx]){
          const first = st.idx === 0;
          st.idx++;
          const pts = []; let x = first ? st.px + rnd(-w * 0.15, w * 0.15) : rnd(w * 0.2, w * 0.8), y = 0;
          const endX = first ? st.px : null, end = first ? st.py - st.ch * 0.4 : rnd(h * 0.5, h * 0.85);
          while(y < end){
            pts.push([x, y]);
            y += rnd(20, 45);
            x += rnd(-30, 30);
            if(endX !== null) x += (endX - x) * clamp01(y / end) * 0.5;
          }
          pts.push([endX !== null ? endX : x, end]);
          st.bolts.push({ pts, life: 1 });
          st.flash = 0.3;
          if(first){
            st.blasted = true;
            for(const c of st.pile){ const a = rnd(-Math.PI * 0.95, -Math.PI * 0.05); const sp = rnd(5, 15) * h / 800; c.vx = Math.cos(a) * sp; c.vy = Math.sin(a) * sp; c.vr = rnd(-0.25, 0.25); }
            for(let i=0;i<40;i++){ const a = rnd(0, 6.283), sp = rnd(2, 7); st.sparks.push({ x: st.px, y: st.py - st.ch * 0.4, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1 }); }
          }
        }
        if(st.flash > 0){ ctx.fillStyle = `rgba(215,225,255,${st.flash})`; ctx.fillRect(0, 0, w, h); st.flash -= 0.03 * dt; }
        for(const c of st.pile){
          if(st.blasted) tumble(c, dt, 0.3 * h / 800);
          drawCard(ctx, c.card, c.x, c.y, st.cw, st.ch, c.rot, 1, st.blasted ? 1 : clamp01(t / 400));
        }
        ctx.globalCompositeOperation = 'lighter';
        for(const p of st.sparks){
          p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.1 * dt; p.life -= 0.03 * dt;
          ctx.fillStyle = `rgba(200,220,255,${Math.max(0, p.life)})`; ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, 6.283); ctx.fill();

    // Cards drift through the dark, each with a few fireflies circling it.

    // A rainbow sweeps across, then your cards ride over it like a slide.
    rainbow: {
      init(w, h){ const { cw, ch } = animCardSize(w, h, 0.9); return { sparks: [], riders: [], next: 2000, cw, ch }; },

    // The 8 finished stacks leap out of their foundation slots, one after another, and scatter.

      step(st, ctx, w, h, t, dt){

    // Your finished King-to-Ace runs parade across the screen, hopping in step.

        const lanes = [0.3, 0.52, 0.74];

    // A giant riffle shuffle, then the deck spreads face-up across the screen in a wave.
    riffle: {

    // A house of cards builds itself level by level... then collapses.

          for(let p=0; p<pairs; p++){
            const px = x0 + p * pairW;
            cards.push({ tx: px - dx, ty: y, trot: a }, { tx: px + dx, ty: y, trot: -a });
          }
          for(let f=0; f<pairs - 1; f++) cards.push({ tx: x0 + (f + 0.5) * pairW, ty: y - ch * Math.cos(a) / 2 - 2, trot: Math.PI / 2 });
        }
        cards.forEach((c, i)=>{ c.card = randCard(); c.at = 200 + i * 150; c.x = c.tx; c.y = c.ty; c.rot = c.trot; c.vx = 0; c.vy = 0; c.vr = 0; });

      },
      step(st, ctx, w, h, t, dt){

      }
    },

    // The deck fans out into a full spinning circle, then flies outward.
    fan: {

    // Cards spring from one pile to the other in a long arc, like a magician's trick -- and back.
    spring: {
      init(w, h){
        const { cw, ch } = animCardSize(w, h, 1.2);
        const n = 44, cards = []; for(let i=0;i<n;i++) cards.push(randCard());
        return { cards, n, cw, ch, ax: w * 0.18, bx: w * 0.82, y: h * 0.68, arc: h * 0.42, dur: 650 };
      },
      step(st, ctx, w, h, t, dt){

        const ch = Math.min(h * 0.26, w / (n * 0.55 + 1.6), 170), cw = ch / 1.4;

    // Cards gather into a slowly turning spiral galaxy, then fling outward.

        }

      }
    },

    // Cards pour off a ledge in a waterfall and splash into the pool below.
    waterfall: {
      init(w, h){
        const { cw, ch } = animCardSize(w, h);
        return { cards: [], drops: [], next: 0, cw, ch, ledgeY: h * 0.3, ledgeX: w * 0.32, pool: h * 0.86 };
      },
      step(st, ctx, w, h, t, dt){
        ctx.clearRect(0,0,w,h);

          else { c.y += c.vy * dt; c.x += c.vx * 0.3 * dt; c.sink -= 0.02 * dt; }
          drawCard(ctx, c.card, c.x, c.y, cw, ch, c.rot, 1, c.sink > 0 ? c.sink : 1);
        }
        st.cards = st.cards.filter(c => !(c.sink < 0) && c.x < w + cw);
        ctx.fillStyle = '#3a2c20';
        roundRectPath(ctx, -20, ledgeY, ledgeX + 24, 18, 8); ctx.fill();
        ctx.fillStyle = 'rgba(40,120,200,0.55)';
        ctx.beginPath(); ctx.moveTo(0, h);
        for(let x=0; x<=w + 12; x+=12) ctx.lineTo(x, pool + Math.sin(x / 40 + t / 300) * 4);
        ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(210,235,255,0.8)';
        for(const d of st.drops){ d.vy += 0.25 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.life -= 0.03 * dt; ctx.beginPath(); ctx.arc(d.x, d.y, 2.2, 0, 6.283); ctx.fill(); }
        st.drops = st.drops.filter(d => d.life > 0 && d.y < h);
        ctx.globalAlpha = 1;
        return t < 7600;
      }
    }
  };

  // ---------------- Win sounds ----------------
  // Gentle generated jingles (one per win, picked at random independently of the
  // animation), plus a soft themed effect for the weather animations. All synthesized with
  // WebAudio -- no sound files. Respects the Sound Effects switch like everything else.
  let noiseBuf = null;
  function getNoise(c){
    if(!noiseBuf){
      const len = c.sampleRate * 2;
      noiseBuf = c.createBuffer(1, len, c.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  }
  const NOTE = n => 440 * Math.pow(2, (n - 69) / 12); // MIDI note number -> Hz
  function tone(c, out, freq, at, dur, o = {}){
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, at);
    if(o.slideTo) osc.frequency.exponentialRampToValueAtTime(o.slideTo, at + dur);
    const vol = o.vol || 0.1, atk = o.attack || 0.01;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    osc.connect(g); g.connect(o.dest || out);
    osc.start(at); osc.stop(at + dur + 0.05);
  }
  function noise(c, out, at, dur, o = {}){
    const src = c.createBufferSource(); src.buffer = getNoise(c); src.loop = true;
    const f = c.createBiquadFilter(); f.type = o.filter || 'lowpass'; f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.freq || 800, at);
    if(o.freqTo) f.frequency.exponentialRampToValueAtTime(o.freqTo, at + dur);
    const g = c.createGain(), vol = o.vol || 0.08;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + (o.attack || 0.05));
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    src.connect(f); f.connect(g); g.connect(out);
    src.start(at, Math.random()); src.stop(at + dur + 0.05);
  }
  const WIN_JINGLES = {
    arpeggio(c, o, t){ [72,76,79,84].forEach((n, i)=> tone(c, o, NOTE(n), t + i * 0.11, 0.5, { type: 'triangle' })); tone(c, o, NOTE(88), t + 0.44, 1.0, { vol: 0.07 }); },
    fanfare(c, o, t){
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1600; f.connect(o);
      [[67,0,.12],[67,.14,.12],[67,.28,.12],[72,.42,.5],[76,.95,.2],[79,1.15,.8]].forEach(([n, s, d])=> tone(c, o, NOTE(n), t + s, d, { type: 'sawtooth', vol: 0.12, attack: 0.02, dest: f }));
    },
    musicbox(c, o, t){ [84,88,91,88,96,91,93,96].forEach((n, i)=> tone(c, o, NOTE(n), t + i * 0.16, 0.9, { vol: 0.06, attack: 0.003 })); },
    marimba(c, o, t){ [60,62,64,67,69,72,74,76].forEach((n, i)=>{ tone(c, o, NOTE(n), t + i * 0.08, 0.35, { vol: 0.11, attack: 0.003 }); tone(c, o, NOTE(n) * 4, t + i * 0.08, 0.08, { vol: 0.025, attack: 0.002 }); }); },
    chimes(c, o, t){ [96,93,91,88,84,81,79].forEach((n, i)=>{ const f = NOTE(n); [1, 2.76, 5.4].forEach((m, k)=> tone(c, o, f * m, t + i * 0.18, 2.2 - k * 0.6, { vol: 0.045 / (k + 1), attack: 0.002 })); }); },
    chiptune(c, o, t){ [72,76,79,84,79,84,88].forEach((n, i)=> tone(c, o, NOTE(n), t + i * 0.07, 0.09, { type: 'square', vol: 0.09, attack: 0.002 })); tone(c, o, NOTE(84), t + 0.55, 0.4, { type: 'square', vol: 0.09 }); },
    harp(c, o, t){ const sc = [0,2,4,7,9]; for(let i=0;i<15;i++) tone(c, o, NOTE(60 + sc[i % 5] + 12 * Math.floor(i / 5)), t + i * 0.045, 1.2, { type: 'triangle', vol: 0.05, attack: 0.004 }); },
    kalimba(c, o, t){ [74,79,81,86,83,79,86].forEach((n, i)=>{ tone(c, o, NOTE(n), t + i * 0.17, 0.7, { vol: 0.09, attack: 0.003 }); tone(c, o, NOTE(n) * 3.01, t + i * 0.17, 0.15, { vol: 0.018, attack: 0.002 }); }); },
    organ(c, o, t){ [48,60,64,67,72].forEach(n=> [1,2,3].forEach((m, k)=> tone(c, o, NOTE(n) * m, t, 2.4, { vol: 0.025 / (k + 1), attack: 0.4 }))); },
    steeldrum(c, o, t){ [[72,0],[76,.15],[79,.3],[76,.45],[81,.6],[79,.9]].forEach(([n, s])=>{ tone(c, o, NOTE(n), t + s, 0.5, { vol: 0.08, attack: 0.004 }); tone(c, o, NOTE(n) * 2.01, t + s, 0.3, { vol: 0.035, attack: 0.004 }); tone(c, o, NOTE(n) * 3.98, t + s, 0.12, { vol: 0.012, attack: 0.003 }); }); },
    whistle(c, o, t){ tone(c, o, NOTE(72), t, 0.5, { vol: 0.11, slideTo: NOTE(84), attack: 0.05 }); tone(c, o, NOTE(84), t + 0.55, 0.18, { vol: 0.11 }); tone(c, o, NOTE(91), t + 0.75, 0.6, { vol: 0.11 }); },
    twinkle(c, o, t){ const sc = [84,86,88,91,93,96,98,100]; for(let i=0;i<14;i++) tone(c, o, NOTE(pick(sc)), t + i * 0.09 + Math.random() * 0.04, 0.6, { vol: 0.065, attack: 0.003 }); }
  };
  const WIN_SFX = {
    tornado(c, o, t){ noise(c, o, t, 4.5, { filter: 'bandpass', freq: 300, freqTo: 1400, q: 2, vol: 0.22, attack: 1.2 }); noise(c, o, t + 2, 3.5, { filter: 'bandpass', freq: 1400, freqTo: 250, q: 2, vol: 0.17, attack: 0.8 }); },
    volcano(c, o, t){ noise(c, o, t + 0.5, 3.5, { freq: 120, vol: 0.16, attack: 0.3 }); tone(c, o, 55, t + 0.5, 1.8, { vol: 0.13, slideTo: 35, attack: 0.02 }); noise(c, o, t + 0.7, 2.5, { freq: 2500, freqTo: 600, vol: 0.025 }); },
    icestorm(c, o, t){ noise(c, o, t, 5, { filter: 'highpass', freq: 2500, vol: 0.035, attack: 1 }); for(let i=0;i<10;i++) tone(c, o, NOTE(96 + Math.floor(Math.random() * 12)), t + 0.3 + i * 0.35 + Math.random() * 0.2, 0.8, { vol: 0.02, attack: 0.002 }); },
    flood(c, o, t){ noise(c, o, t, 5, { freq: 500, vol: 0.07, attack: 1.5 }); for(let i=0;i<12;i++){ const s = t + 0.4 + i * 0.3 + Math.random() * 0.2, f = rnd(300, 700); tone(c, o, f, s, 0.12, { vol: 0.04, slideTo: f * 2, attack: 0.005 }); } },
    lightning(c, o, t){ [0.5, 2.3, 3.9].forEach(s=>{ noise(c, o, t + s, 0.25, { filter: 'highpass', freq: 1500, vol: 0.1, attack: 0.005 }); noise(c, o, t + s + 0.05, 2.2, { freq: 180, vol: 0.14, attack: 0.08 }); }); noise(c, o, t, 6, { filter: 'highpass', freq: 1800, vol: 0.025, attack: 0.5 }); },
    fireworks(c, o, t){ for(let i=0;i<7;i++){ const s = t + 0.5 + i * 0.55 + Math.random() * 0.2; noise(c, o, s, 0.35, { freq: 900, vol: 0.1, attack: 0.003 }); for(let k=0;k<5;k++) noise(c, o, s + 0.25 + Math.random() * 0.5, 0.04, { filter: 'highpass', freq: 3000, vol: 0.03, attack: 0.002 }); } }
  };
  function playWinSound(animName){
    if(!soundOn) return null;
    const c = ensureAudio();
    if(!c) return null;
    if(c.state === 'suspended') c.resume();
    const out = c.createGain(); out.gain.value = 0.9; out.connect(c.destination);
    const t = c.currentTime + 0.05;
    const name = nextFromBag(WIN_SOUND_KEY, Object.keys(WIN_JINGLES));
    WIN_JINGLES[name](c, out, t);
    if(WIN_SFX[animName]) WIN_SFX[animName](c, out, t);
    return name;
  }

  // Truly random pick for the win animations and jingles, so there's no pattern to predict --
  // it only avoids whatever played in the last few wins (persisted, so it holds across reloads).
  function nextFromBag(storageKey, keys, avoid = 3){
    let recent = [];
    try{ const saved = JSON.parse(localStorage.getItem(storageKey)); if(saved && Array.isArray(saved.recent)) recent = saved.recent; }catch(e){}
    const fresh = keys.filter(k => !recent.slice(-avoid).includes(k));
    const pool = fresh.length ? fresh : keys;
    const name = pool[Math.floor(Math.random() * pool.length)];
    recent = recent.concat(name).slice(-avoid);
    try{ localStorage.setItem(storageKey, JSON.stringify({ recent })); }catch(e){}
    return name;
  }
  function nextWinAnimName(){ return nextFromBag(WIN_ANIM_KEY, Object.keys(WIN_ANIMS)); }

  function stopWinAnimation(){
    if(!winAnim) return;
    cancelAnimationFrame(winAnim.raf);
    clearTimeout(winAnim.fadeTimer);
    winAnim.canvas.remove();
    winAnim = null;
  }

  function playWinAnimation(name){
    stopWinAnimation();
    if(!WIN_ANIMS[name]) name = nextWinAnimName();
    const anim = WIN_ANIMS[name];
    const overlay = document.getElementById('winOverlay');
    const canvas = document.createElement('canvas');
    canvas.className = 'winCanvas';
    canvas.dataset.anim = name;
    overlay.insertBefore(canvas, overlay.firstChild);
    const w = window.innerWidth, h = window.innerHeight, dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const st = anim.init(w, h);
    const ctl = { canvas, raf: 0, fadeTimer: 0, name };
    const start = performance.now();
    let last = start;
    function frame(now){
      const t = now - start;
      const dt = Math.min(3, Math.max(0, (now - last) / 16.667));
      last = now;
      const running = anim.step(st, ctx, w, h, t, dt);
      if(running && t < 15000){ ctl.raf = requestAnimationFrame(frame); return; }
      canvas.style.opacity = '0';
      ctl.fadeTimer = setTimeout(()=>{ if(winAnim === ctl) stopWinAnimation(); }, 900);
    }
    ctl.raf = requestAnimationFrame(frame);
    winAnim = ctl;
    return name;
  }

  // ---------------- Toast ----------------
  let toastTimer = null;
  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
  }

  // ---------------- Sound ----------------
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
    }
    return audioCtx;
  }
  function playSound(kind){
    if(!soundOn) return;
    const ctx = ensureAudio();
    if(!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    let freq = 440, dur = 0.08, type='sine';
    if(kind === 'move'){ freq = 520; dur = 0.06; }
    else if(kind === 'deal'){ freq = 360; dur = 0.05; }
    else if(kind === 'complete'){ freq = 700; dur = 0.25; type='triangle'; }
    else if(kind === 'win'){ freq = 880; dur = 0.6; type='triangle'; }
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.15, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.start(now);
    osc.stop(now + dur + 0.02);
    if(kind === 'complete' || kind === 'win'){
      const osc2 = ctx.createOscillator();
      osc2.type = type;
      osc2.frequency.setValueAtTime(freq*1.5, now+0.08);
      osc2.connect(gain);
      osc2.start(now+0.08); osc2.stop(now+0.08+dur);
    }
  }

  // ---------------- Auto-Solve ----------------
  // A best-effort bot: greedy heuristic playouts (prefer revealing hidden cards, then
  // extending a run, then dealing) with many randomized restarts, run on a scratch copy
  // of the board so it can search fast without touching the real game. It replays whichever
  // line got furthest against the REAL engine (performMove/dealStock — the same functions
  // the UI uses), so every move it makes is fully rule-checked. It is not a guaranteed
  // solver — Spider is a genuinely hard search problem — so it may finish short of 8/8.
  function cloneCards(arr){ return arr.map(c => ({id:c.id, suit:c.suit, rank:c.rank, up:c.up})); }
  function cloneSim(s){
    return { columns: s.columns.map(cloneCards), stock: cloneCards(s.stock), completed: s.completed.slice() };
  }
  function findValidStartSim(columns, colIdx){
    const arr = columns[colIdx];
    if(arr.length === 0) return 0;
    let i = arr.length - 1;
    if(!arr[i].up) return arr.length;
    while(i > 0 && arr[i-1].up && arr[i-1].suit === arr[i].suit && arr[i-1].rank === arr[i].rank + 1) i--;
    return i;
  }
  function canDropSim(columns, seq, destColIdx){
    const dest = columns[destColIdx];
    if(dest.length === 0) return true;
    const top = dest[dest.length-1];
    return top.up && top.rank === seq[0].rank + 1;
  }
  function checkCompletedSim(sim){
    for(let c=0;c<10;c++){
      const arr = sim.columns[c];
      if(arr.length >= 13){
        const tail = arr.slice(-13);
        if(tail[0].rank === 13 && tail.every(cd=>cd.up)){
          let ok = true;
          for(let k=0;k<12;k++){ if(tail[k].suit !== tail[k+1].suit || tail[k].rank !== tail[k+1].rank + 1){ ok=false; break; } }
          if(ok && tail[12].rank === 1){
            sim.columns[c] = arr.slice(0, arr.length-13);
            if(sim.columns[c].length) sim.columns[c][sim.columns[c].length-1].up = true;
            sim.completed.push(1);
          }
        }
      }
    }
  }
  function doMoveSim(sim, fromCol, fromIdx, toCol){
    const arr = sim.columns[fromCol];
    const seq = arr.slice(fromIdx);
    sim.columns[fromCol] = arr.slice(0, fromIdx);
    if(sim.columns[fromCol].length) sim.columns[fromCol][sim.columns[fromCol].length-1].up = true;
    sim.columns[toCol] = sim.columns[toCol].concat(seq);
    checkCompletedSim(sim);
  }
  function doDealSim(sim){
    for(let c=0;c<10;c++){ const card = sim.stock.pop(); card.up = true; sim.columns[c].push(card); }
    checkCompletedSim(sim);
  }
  function legalMovesSim(sim){
    const moves = [];
    for(let from=0; from<10; from++){
      const arr = sim.columns[from];
      if(arr.length === 0) continue;
      const vs = findValidStartSim(sim.columns, from);
      for(let start=vs; start<arr.length; start++){
        const seq = arr.slice(start);
        for(let to=0; to<10; to++){
          if(to === from) continue;
          if(canDropSim(sim.columns, seq, to)){
            moves.push({from, start, to, revealsHidden: start>0 && !arr[start-1].up, len: seq.length, toEmpty: sim.columns[to].length===0});
          }
        }
      }
    }
    return moves;
  }
  function stateHash(sim){
    return sim.columns.map(c => c.map(cd => cd.id + (cd.up?'u':'d')).join(',')).join('|') + '#' + sim.stock.length;
  }
  function solverPlayout(initSim, maxActions){
    const sim = cloneSim(initSim);
    const actions = [];
    const seen = new Set([stateHash(sim)]);
    for(let step=0; step<maxActions; step++){
      if(sim.completed.length >= 8) return {win:true, actions, completed: sim.completed.length};
      let moves = legalMovesSim(sim);
      moves.forEach(m => { m.rnd = Math.random(); });
      moves.sort((a,b) => (b.revealsHidden - a.revealsHidden) || ((!a.toEmpty) - (!b.toEmpty)) || (b.len - a.len) || (a.rnd - b.rnd));
      const bestReveals = moves.length && moves[0].revealsHidden;
      if(!bestReveals && sim.stock.length > 0){
        const trial = cloneSim(sim);
        doDealSim(trial);
        const h = stateHash(trial);
        if(!seen.has(h)){ seen.add(h); Object.assign(sim, trial); actions.push({type:'deal'}); continue; }
      }
      let applied = false;
      for(let i=0; i<moves.length; i++){
        const m = moves[i];
        const trial = cloneSim(sim);
        doMoveSim(trial, m.from, m.start, m.to);
        const h = stateHash(trial);
        if(!seen.has(h)){
          seen.add(h); Object.assign(sim, trial);
          actions.push({type:'move', from:m.from, idx:m.start, to:m.to});
          applied = true; break;
        }
      }
      if(applied) continue;
      if(sim.stock.length > 0){
        const trial = cloneSim(sim);
        doDealSim(trial);
        const h = stateHash(trial);
        if(!seen.has(h)){ seen.add(h); Object.assign(sim, trial); actions.push({type:'deal'}); continue; }
      }
      break; // truly stuck
    }
    return {win: sim.completed.length >= 8, actions, completed: sim.completed.length};
  }

  let solving = false;
  function setControlsDisabled(disabled){
    ['btnNew','btnRestart','btnUndo','btnHint','btnSolve','stockPile'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.style.pointerEvents = disabled ? 'none' : '';
    });
  }
  function autoSolve(){
    if(solving) return;
    solving = true;
    setControlsDisabled(true);
    toast('🤖 Solving… this can take a few seconds');
    setTimeout(()=>{
      const initSim = { columns: state.columns.map(cloneCards), stock: cloneCards(state.stock), completed: [] };
      const ATTEMPTS = 2000, MAX_ACTIONS = 600;
      let best = null;
      for(let a=0; a<ATTEMPTS; a++){
        const res = solverPlayout(initSim, MAX_ACTIONS);
        if(!best || (res.win && !best.win) || (res.completed > best.completed) ||
           (res.win === best.win && res.completed === best.completed && res.actions.length < best.actions.length)){
          best = res;
        }
        if(best.win) break;
      }
      // Animate the chosen line against the REAL engine, one action at a time.
      let i = 0;
      const step = setInterval(()=>{
        if(i >= best.actions.length){
          clearInterval(step);
          solving = false;
          setControlsDisabled(false);
          toast(best.win ? '🤖 Solved it! 8/8 sets.' : `🤖 Got stuck at ${state.completed.length}/8 sets — no full solve this time.`);
          return;
        }
        const act = best.actions[i++];
        if(act.type === 'move') performMove(act.from, act.idx, act.to);
        else dealStock();
      }, 90);
    }, 30);
  }

  // ---------------- Persistence ----------------
  // Refreshing the page, or a browser switching "desktop/mobile site" mode (which reloads
  // the page), used to silently discard the whole game. Autosave the board to localStorage
  // after every render and reload it on startup instead of always dealing a fresh game.
  const SAVE_KEY = 'spiderSolitaireSaveV1';
  function saveGame(){
    if(!state) return;
    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        columns: state.columns,
        stock: state.stock,
        completed: state.completed,
        score: state.score,
        moves: state.moves,
        suitCount, soundOn, elapsedSec, cardBackTheme, tableTheme, preferredSuit, randomSuit,
        initialState
      }));
    }catch(e){ /* private browsing / storage disabled — just skip persistence */ }
  }
  function loadSavedGame(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return null;
      const data = JSON.parse(raw);
      if(!data || !Array.isArray(data.columns) || data.columns.length !== 10 || !Array.isArray(data.stock)) return null;
      return data;
    }catch(e){ return null; }
  }
  function restoreGame(data){
    state = {
      columns: data.columns,
      stock: data.stock,
      completed: Array.isArray(data.completed) ? data.completed : [],
      score: typeof data.score === 'number' ? data.score : 500,
      moves: typeof data.moves === 'number' ? data.moves : 0
    };
    suitCount = (data.suitCount === 1 || data.suitCount === 2) ? data.suitCount : 4;
    soundOn = data.soundOn !== false;
    const soundEl = document.getElementById('soundToggle');
    if(soundEl) soundEl.checked = soundOn;
    applyCardBackTheme(data.cardBackTheme);
    applyTableTheme(data.tableTheme);
    // Saves from before the suit picker existed were always dealt in spades.
    preferredSuit = SUIT_PARTNER[data.preferredSuit] ? data.preferredSuit : '♠';
    randomSuit = data.randomSuit !== false;
    updateSuitChoiceUI();
    // Absent in a save written before this feature shipped -- Restart just stays disabled for
    // that one loaded game (see updateStats()) rather than restoring to the wrong thing.
    initialState = (data.initialState && Array.isArray(data.initialState.columns)) ? data.initialState : null;
    history = [];
    selected = null;
    updateSuitPillUI();
    startTimer(typeof data.elapsedSec === 'number' ? data.elapsedSec : 0);
    render();
    updateStats();
    if(state.completed.length >= 8) triggerWin(false);
  }

  // ---------------- Win/best-time stats ----------------
  // A separate localStorage key from SAVE_KEY (the in-progress game) -- this needs to survive
  // across every new game and reload instead of being overwritten by the next deal, keyed per
  // difficulty since a 4-suit time/move-count isn't comparable to a 1-suit one.
  const STATS_KEY = 'spiderSolitaireStatsV1';
  function emptyStatsEntry(){ return { wins: 0, bestTime: null, bestMoves: null }; }
  function loadStats(){
    try{
      const raw = localStorage.getItem(STATS_KEY);
      const data = raw ? JSON.parse(raw) : {};
      [1,2,4].forEach(n=>{
        const e = data[n];
        data[n] = (e && typeof e === 'object') ? {
          wins: typeof e.wins === 'number' ? e.wins : 0,
          bestTime: typeof e.bestTime === 'number' ? e.bestTime : null,
          bestMoves: typeof e.bestMoves === 'number' ? e.bestMoves : null
        } : emptyStatsEntry();
      });
      return data;
    }catch(e){
      return { 1: emptyStatsEntry(), 2: emptyStatsEntry(), 4: emptyStatsEntry() };
    }
  }
  function saveStats(){
    try{ localStorage.setItem(STATS_KEY, JSON.stringify(gameStats)); }
    catch(e){ /* private browsing / storage disabled — just skip persistence */ }
  }
  let gameStats = loadStats();

  // Updates the current difficulty's entry against THIS win's time/moves, returns which (if
  // either) was actually a new record so the win screen can call it out.
  function recordWin(){
    const entry = gameStats[suitCount] || (gameStats[suitCount] = emptyStatsEntry());
    entry.wins++;
    const newBestTime = entry.bestTime === null || elapsedSec < entry.bestTime;
    const newBestMoves = entry.bestMoves === null || state.moves < entry.bestMoves;
    if(newBestTime) entry.bestTime = elapsedSec;
    if(newBestMoves) entry.bestMoves = state.moves;
    saveStats();
    return { newBestTime, newBestMoves };
  }

  // Shows either a "new record" badge per stat actually beaten, or — when this win didn't beat
  // anything (or isn't a fresh win at all, see triggerWin's isNewWin) — a quiet reminder of
  // what the real best for this difficulty is, so the numbers above have something to compare
  // against either way.
  function renderWinBest(newBestTime, newBestMoves){
    const el = document.getElementById('winBest');
    const entry = gameStats[suitCount];
    if(!entry){ el.innerHTML = ''; return; }
    const badges = [];
    if(newBestTime) badges.push('⏱️ New best time!');
    if(newBestMoves) badges.push('🎯 New best moves!');
    if(badges.length){
      el.innerHTML = badges.map(b => `<span class="win-badge">${b}</span>`).join('');
    } else if(entry.bestTime !== null){
      el.innerHTML = `<div class="win-best-summary">Your best: ${formatTime(entry.bestTime)} · ${entry.bestMoves} moves</div>`;
    } else {
      el.innerHTML = '';
    }
  }

  // Rebuilt each time the overlay opens rather than kept in sync live -- it's only ever shown
  // right after a fresh read of gameStats, so there's no staleness window worth avoiding here.
  function renderStatsTable(){
    const wrap = document.getElementById('statsTable');
    const labels = { 1: '1 Suit', 2: '2 Suits', 4: '4 Suits' };
    wrap.innerHTML = `
      <div class="statsHeader">
        <span></span><span>Wins</span><span>Best Time</span><span>Best Moves</span>
      </div>
    `;
    [1,2,4].forEach(n=>{
      const entry = gameStats[n] || emptyStatsEntry();
      const row = document.createElement('div');
      row.className = 'statsRow';
      const timeStr = entry.bestTime !== null ? formatTime(entry.bestTime) : '—';
      const movesStr = entry.bestMoves !== null ? entry.bestMoves : '—';
      row.innerHTML = `
        <span class="statsDiff">${labels[n]}</span>
        <span class="statsVal${entry.wins === 0 ? ' empty' : ''}">${entry.wins}</span>
        <span class="statsVal${entry.bestTime === null ? ' empty' : ''}">${timeStr}</span>
        <span class="statsVal${entry.bestMoves === null ? ' empty' : ''}">${movesStr}</span>
      `;
      wrap.appendChild(row);
    });
  }

  // ---------------- Settings UI ----------------
  function updateSuitPillUI(){
    document.querySelectorAll('#suitPills .pill').forEach(p=>{
      p.classList.toggle('active', parseInt(p.dataset.suits,10) === suitCount);
    });
    updateSuitChoiceUI();
  }

  // Built once from CARD_BACK_THEMES rather than hardcoded in the HTML, so the markup and the
  // theme list can't drift out of sync -- add a theme to the object above and it just appears.
  function buildCardBackSwatches(){
    const wrap = document.getElementById('cardBackSwatches');
    wrap.innerHTML = '';
    Object.keys(CARD_BACK_THEMES).forEach(key=>{
      const t = CARD_BACK_THEMES[key];
      const sw = document.createElement('div');
      sw.className = 'swatch';
      sw.dataset.theme = key;
      sw.title = t.name;
      sw.style.setProperty('--sw1', t.c1);
      sw.style.setProperty('--sw2', t.c2);
      wrap.appendChild(sw);
    });
  }

  // Swapping the theme is just updating two CSS custom properties -- .card.facedown and
  // .stockPile both read var(--back-1)/var(--back-2) already, so every facedown card and the
  // stock pile repaint immediately with no re-render needed.
  function applyCardBackTheme(name){
    cardBackTheme = CARD_BACK_THEMES[name] ? name : 'purple';
    const t = CARD_BACK_THEMES[cardBackTheme];
    document.documentElement.style.setProperty('--back-1', t.c1);
    document.documentElement.style.setProperty('--back-2', t.c2);
    document.querySelectorAll('#cardBackSwatches .swatch').forEach(sw=>{
      sw.classList.toggle('active', sw.dataset.theme === cardBackTheme);
    });
  }

  function buildTableSwatches(){
    const wrap = document.getElementById('tableSwatches');
    wrap.innerHTML = '';
    Object.keys(TABLE_THEMES).forEach(key=>{
      const t = TABLE_THEMES[key];
      const sw = document.createElement('div');
      sw.className = 'swatch';
      sw.dataset.theme = key;
      sw.title = t.name;
      sw.style.setProperty('--sw1', t.f2);
      sw.style.setProperty('--sw2', t.f1);
      wrap.appendChild(sw);
    });
  }
  function applyTableTheme(name){
    tableTheme = TABLE_THEMES[name] ? name : 'green';
    const t = TABLE_THEMES[tableTheme];
    const root = document.documentElement.style;
    root.setProperty('--felt-1', t.f1);
    root.setProperty('--felt-2', t.f2);
    root.setProperty('--dlg-1', t.d1);
    root.setProperty('--dlg-2', t.d2);
    root.setProperty('--panel-solid', t.panel);
    document.querySelectorAll('#tableSwatches .swatch').forEach(sw=>{
      sw.classList.toggle('active', sw.dataset.theme === tableTheme);
    });
  }

  function buildSuitChoices(){
    const wrap = document.getElementById('suitChoices');
    wrap.innerHTML = '';
    const names = { '♠':'Spades', '♥':'Hearts', '♦':'Diamonds', '♣':'Clubs' };
    ALL_SUITS.forEach(s=>{
      const b = document.createElement('div');
      b.className = 'suitChoice ' + s.color;
      b.dataset.suit = s.sym;
      b.title = names[s.sym];
      b.textContent = s.sym;
      wrap.appendChild(b);
    });
  }
  function updateSuitChoiceUI(){
    document.querySelectorAll('#suitChoices .suitChoice').forEach(b=>{
      b.classList.toggle('active', !randomSuit && b.dataset.suit === preferredSuit);
    });
    document.getElementById('randomSuitToggle').checked = randomSuit;
    const note = document.getElementById('suitNote');
    const group = document.getElementById('suitChoices');
    group.classList.toggle('disabled', suitCount === 4);
    const thisGame = suitCount === 2 ? preferredSuit + ' ' + SUIT_PARTNER[preferredSuit] : preferredSuit;
    if(suitCount === 4) note.textContent = '4 Suits always uses all four — applies to 1 & 2 Suit games.';
    else if(randomSuit) note.textContent = 'This game: ' + thisGame + '. Pick a suit to keep it for every game.';
    else if(suitCount === 2) note.textContent = 'Paired with ' + SUIT_PARTNER[preferredSuit] + ' in 2 Suits.';
    else note.textContent = '';
  }
  // Re-skins every card in the current game (board, stock, completed sets, undo history and
  // the Restart snapshot) from the old suit(s) to the new ones, so switching suit mid-game
  // keeps your progress. Same-suit runs stay same-suit because the mapping is one-to-one.
  function setPreferredSuit(sym){
    if(!SUIT_PARTNER[sym]) return;
    randomSuit = false;
    if(sym === preferredSuit){ updateSuitChoiceUI(); saveGame(); return; }
    const map = {};
    map[preferredSuit] = sym;
    map[SUIT_PARTNER[preferredSuit]] = SUIT_PARTNER[sym];
    preferredSuit = sym;
    if(suitCount !== 4){
      const walk = (o)=>{
        if(Array.isArray(o)){ o.forEach(walk); return; }
        if(o && typeof o === 'object'){
          if(typeof o.suit === 'string' && map[o.suit]){
            const ns = suitBySym(map[o.suit]);
            o.suit = ns.sym; o.color = ns.color;
          }
          for(const k in o){ if(o[k] && typeof o[k] === 'object') walk(o[k]); }
        }
      };
      walk(state); walk(initialState); walk(history);
      render();
    }
    updateSuitChoiceUI();
    saveGame();
  }

  // Difficulty tabs act directly, like solitaired.com's — picking one starts a new game at
  // that difficulty right away (confirming first if a game is already in progress) rather than
  // just staging a choice for a separate "Start New Game" button.
  document.getElementById('suitPills').addEventListener('click', (e)=>{
    const pill = e.target.closest('.pill');
    if(!pill) return;
    const suits = parseInt(pill.dataset.suits, 10);
    if(suits === suitCount) return;
    confirmNewGameIfNeeded(()=> newGame(suits));
  });

  document.getElementById('soundToggle').addEventListener('change', (e)=>{
    soundOn = e.target.checked;
    saveGame();
  });

  buildCardBackSwatches();
  document.getElementById('cardBackSwatches').addEventListener('click', (e)=>{
    const sw = e.target.closest('.swatch');
    if(!sw) return;
    applyCardBackTheme(sw.dataset.theme);
    saveGame();
  });

  buildTableSwatches();
  document.getElementById('tableSwatches').addEventListener('click', (e)=>{
    const sw = e.target.closest('.swatch');
    if(!sw) return;
    applyTableTheme(sw.dataset.theme);
    saveGame();
  });

  buildSuitChoices();
  document.getElementById('randomSuitToggle').addEventListener('change', (e)=>{
    randomSuit = e.target.checked;
    // Turning random off without tapping a suit holds the current game's suit.
    updateSuitChoiceUI();
    saveGame();
  });
  document.getElementById('suitChoices').addEventListener('click', (e)=>{
    const b = e.target.closest('.suitChoice');
    if(!b) return;
    setPreferredSuit(b.dataset.suit);
  });

  document.getElementById('btnSettings').addEventListener('click', (e)=>{
    e.stopPropagation();
    const panel = document.getElementById('settingsPanel');
    const opening = !panel.classList.contains('open');
    if(opening){
      // position:fixed means this is no longer placed by #settingsWrap's own CSS — pin it
      // just below and right-aligned to the button itself, in viewport coordinates.
      const btnRect = e.currentTarget.getBoundingClientRect();
      panel.style.top = (btnRect.bottom + 10) + 'px';
      panel.style.right = (window.innerWidth - btnRect.right) + 'px';
    }
    panel.classList.toggle('open');
  });
  document.addEventListener('pointerdown', (e)=>{
    const panel = document.getElementById('settingsPanel');
    const btn = document.getElementById('btnSettings');
    if(panel.classList.contains('open') && !panel.contains(e.target) && e.target !== btn){
      panel.classList.remove('open');
    }
  });

  // In-page confirm modal — NOT window.confirm(). That native dialog is disabled/silently
  // returns false in many embedded webviews and sandboxed iframes (this page can run inside
  // one), which made "New Game" appear completely dead as soon as autosave gave it a
  // game with moves > 0 to confirm over. Shared by New Game and Restart (each fills in its
  // own title/message/button text via showConfirm() rather than getting a separate overlay).
  let pendingConfirmCb = null;
  function showConfirm(opts, cb){
    pendingConfirmCb = cb;
    document.getElementById('confirmTitle').textContent = opts.title;
    document.getElementById('confirmMsg').textContent = opts.message;
    document.getElementById('btnConfirmYes').textContent = opts.confirmLabel;
    document.getElementById('confirmOverlay').classList.add('show');
  }
  function confirmNewGameIfNeeded(cb){
    if(state && state.moves > 0 && state.completed.length < 8){
      showConfirm({
        title: 'Start a new game?',
        message: 'Current progress will be lost.',
        confirmLabel: 'Start New Game'
      }, cb);
      return;
    }
    cb();
  }
  function confirmRestartIfNeeded(cb){
    if(state && state.moves > 0 && state.completed.length < 8){
      showConfirm({
        title: 'Restart this deal?',
        message: 'All moves will be undone, back to the very first deal.',
        confirmLabel: 'Restart'
      }, cb);
      return;
    }
    cb();
  }
  document.getElementById('btnConfirmYes').addEventListener('click', ()=>{
    document.getElementById('confirmOverlay').classList.remove('show');
    const cb = pendingConfirmCb;
    pendingConfirmCb = null;
    if(cb) cb();
  });
  document.getElementById('btnConfirmCancel').addEventListener('click', ()=>{
    document.getElementById('confirmOverlay').classList.remove('show');
    pendingConfirmCb = null;
  });

  document.getElementById('btnNew').addEventListener('click', ()=>{
    confirmNewGameIfNeeded(()=> newGame());
  });
  document.getElementById('btnRestart').addEventListener('click', ()=>{
    confirmRestartIfNeeded(restart);
  });
  document.getElementById('btnUndo').addEventListener('click', undo);
  document.getElementById('btnHint').addEventListener('click', hint);
  document.getElementById('btnSolve').addEventListener('click', autoSolve);
  document.getElementById('stockPile').addEventListener('click', dealStock);
  document.getElementById('btnPlayAgain').addEventListener('click', ()=>{
    document.getElementById('winOverlay').classList.remove('show');
    newGame(suitCount);
  });
  document.getElementById('btnStats').addEventListener('click', ()=>{
    document.getElementById('settingsPanel').classList.remove('open');
    renderStatsTable();
    document.getElementById('statsOverlay').classList.add('show');
  });
  document.getElementById('btnStatsClose').addEventListener('click', ()=>{
    document.getElementById('statsOverlay').classList.remove('show');
  });

  window.addEventListener('keydown', (e)=>{
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); undo(); }
    else if(e.key.toLowerCase() === 'h'){ hint(); }
    else if(e.key.toLowerCase() === 'n'){ confirmNewGameIfNeeded(()=>newGame()); }
  });

  let resizeTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 120);
  });

  // ---------------- Init ----------------
  const savedGame = loadSavedGame();
  if(savedGame){ restoreGame(savedGame); }
  else { applyCardBackTheme('purple'); applyTableTheme('green'); newGame(1); }

})();
</script>
</body>
</html>
